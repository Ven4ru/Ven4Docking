plugins {
    id 'com.android.application'
}

android {
    namespace 'ru.ven4tools.docking'
    compileSdk 34
    buildToolsVersion '34.0.0'

    defaultConfig {
        applicationId 'ru.ven4tools.docking'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0.0'
        // release: agent 8765, discovery 8766
        buildConfigField 'int', 'AGENT_PORT', '8765'
        buildConfigField 'int', 'DISCOVERY_PORT', '8766'
    }

    // Release signing: CI decodes the keystore from secrets and sets ANDROID_KEYSTORE_FILE,
    // ANDROID_KEYSTORE_PASS, ANDROID_KEY_ALIAS (ANDROID_KEY_PASS optional, defaults to the store password).
    // Without them (local build.ps1, forks) the release APK is signed with the debug key:
    // same 8765/8766 ports as the installed agent, but not suitable for publishing.
    def releaseKeystore = System.getenv('ANDROID_KEYSTORE_FILE')
    signingConfigs {
        release {
            if (releaseKeystore) {
                storeFile file(releaseKeystore)
                storePassword System.getenv('ANDROID_KEYSTORE_PASS')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASS') ?: System.getenv('ANDROID_KEYSTORE_PASS')
            }
        }
    }

    buildTypes {
        debug {
            // development agent runs next to the prototype: 18765 / 18766
            buildConfigField 'int', 'AGENT_PORT', '18765'
            buildConfigField 'int', 'DISCOVERY_PORT', '18766'
        }
        release {
            minifyEnabled false
            signingConfig releaseKeystore ? signingConfigs.release : signingConfigs.debug
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    // JVM unit tests (src/test) only; nothing is added to the APK
    testImplementation 'junit:junit:4.13.2'
}
