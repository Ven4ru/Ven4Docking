[package]
name = "ven4docking-agent"
version = "1.0.0"
edition = "2021"
license = "MIT"

[lib]
name = "ven4docking_agent"
path = "src/lib.rs"

[[bin]]
name = "ven4docking-agent"
path = "src/main.rs"

[dependencies]
async-trait = "0.1.92"
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "json", "query", "matched-path"] }
base64 = "0.23.1"
futures-util = { version = "0.3.34", default-features = false, features = ["sink"] }
getrandom = "0.3"
russh = "0.45.0"
russh-keys = "0.45.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.2"
sysinfo = { version = "0.40.4", default-features = false, features = ["system", "disk", "network"] }
tokio = { version = "1.54.1", default-features = false, features = ["rt", "net", "time", "sync", "macros", "io-util"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std"] }
tray-icon = "0.27.0"
windows = { version = "0.62.2", features = ["Wdk_Graphics_Direct3D", "Win32_Foundation", "Win32_System_Performance", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_NetworkManagement_WindowsFirewall", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Ole", "Win32_System_Variant", "Win32_Networking_WinSock", "Win32_Networking_WinHttp", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_Shell_PropertiesSystem", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_System_ProcessStatus", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Power", "Win32_System_Shutdown", "Win32_System_Memory", "Win32_System_Registry", "Win32_Security", "Win32_Security_Cryptography", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Media_Control", "Foundation", "Foundation_Collections", "Data_Xml_Dom", "ApplicationModel", "UI_Notifications", "UI_Notifications_Management", "Storage_Streams", "Graphics_Imaging"] }

[dev-dependencies]
http-body-util = "0.1.5"
tower = { version = "0.5.3", features = ["util"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
