# Ven4Docking: checks and build on every push/PR to main; a tag vX.Y.Z also publishes a GitHub release.
# Packaging reuses build.ps1 (same layout as local builds), the agent is built for x86_64-pc-windows-msvc
# (agent/.cargo/config.toml defaults to the gnu target for machines without Visual Studio).
#
# Launcher signing secrets (optional for branches, required for tags):
#   ANDROID_KEYSTORE_B64   base64 of the release keystore (.jks)
#   ANDROID_KEYSTORE_PASS  keystore password (also used as the key password)
#   ANDROID_KEY_ALIAS      key alias
# Without them the release APK is signed with the debug key (fine for testing, never published).

name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  AGENT_TARGET: x86_64-pc-windows-msvc
  CARGO_TERM_COLOR: always
  DOTNET_NOLOGO: '1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_B64 != '' }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Version check (tags)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          $v = (Select-String -Path agent/Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          if ("v$v" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} does not match agent/Cargo.toml version $v" }
          if ($env:HAS_KEYSTORE -ne 'true') { throw 'Release tags need the ANDROID_KEYSTORE_* secrets (the APK must not be debug-signed).' }

      # ---------------------------------------------------------------- toolchains
      - name: Rust
        run: |
          rustup toolchain install stable --profile minimal --target $env:AGENT_TARGET
          rustup default stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            agent/target
          key: cargo-${{ runner.os }}-${{ hashFiles('agent/Cargo.lock') }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: panel/package-lock.json
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: NSIS
        run: |
          # portable NSIS from the project's SourceForge files, pinned by hash (the Chocolatey feed was answering 503)
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue) -and -not (Test-Path "${env:ProgramFiles(x86)}\NSIS\makensis.exe")) {
            $ver = '3.12'
            $sha = '56581F90DB321581C5381193D796FFFCF2D24B2F8FED2160A6C6A3BAA67F2C4F'
            $zip = Join-Path $env:RUNNER_TEMP 'nsis.zip'
            for ($i = 1; $i -le 3; $i++) {
              curl.exe -sSfL --max-time 180 -o $zip "https://downloads.sourceforge.net/project/nsis/NSIS%203/$ver/nsis-$ver.zip"
              if ($LASTEXITCODE -eq 0 -and (Get-FileHash $zip -Algorithm SHA256).Hash -eq $sha) { break }
              if ($i -eq 3) { throw 'NSIS download failed or hash mismatch' }
              Start-Sleep -Seconds (15 * $i)
            }
            Expand-Archive $zip -DestinationPath $env:RUNNER_TEMP -Force
            Join-Path $env:RUNNER_TEMP "nsis-$ver" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          }

      # ---------------------------------------------------------------- checks
      - name: Agent tests
        working-directory: agent
        run: cargo test --target $env:AGENT_TARGET
      - name: Panel lint
        working-directory: panel
        run: |
          npm ci --no-audit --no-fund
          npm run lint
      - name: Editor tests
        run: dotnet test editor/Ven4Docking.Editor.sln -c Release
      - name: Launcher tests
        working-directory: android
        run: ./gradlew.bat testReleaseUnitTest --no-daemon --console=plain

      # ---------------------------------------------------------------- launcher signing
      - name: Release keystore
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          $ks = Join-Path $env:RUNNER_TEMP 'release.jks'
          [IO.File]::WriteAllBytes($ks, [Convert]::FromBase64String($env:KEYSTORE_B64))
          "ANDROID_KEYSTORE_FILE=$ks" >> $env:GITHUB_ENV

      # ---------------------------------------------------------------- build + package
      - name: Build (agent, panel, editor, APK, installer, zip)
        env:
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: ./build.ps1 -AgentTarget $env:AGENT_TARGET

      - name: Remove keystore
        if: always() && env.HAS_KEYSTORE == 'true'
        run: Remove-Item (Join-Path $env:RUNNER_TEMP 'release.jks') -ErrorAction SilentlyContinue

      - uses: actions/upload-artifact@v4
        with:
          name: ven4docking-${{ github.sha }}
          path: |
            dist/Ven4Docking-Setup-*.exe
            dist/Ven4Docking-*.zip
            dist/ven4docking-launcher-*.apk
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ven4docking-${{ github.sha }}
          path: dist
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum -c SHA256SUMS
          gh release create "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --title "Ven4Docking ${{ github.ref_name }}" \
            --notes "Установщик для Windows 10/11 — Ven4Docking-Setup-*.exe. Лаунчер для телефона ставится из редактора (мастер «Подключить телефон»). Контрольные суммы — SHA256SUMS." \
            Ven4Docking-Setup-*.exe Ven4Docking-*.zip ven4docking-launcher-*.apk SHA256SUMS
